# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── DataSource (MySQL via Docker) ────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/sportsbooking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=sportsuser
spring.datasource.password=sportspass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── JWT ──────────────────────────────────────────────────────────────────────
# Generate a strong secret before going to production (>= 256-bit base64).
app.jwt.secret=c3BvcnRzZmllbGRib29raW5nc3lzdGVtc2VjcmV0a2V5Zm9yand0YXV0aA==
app.jwt.expiration-ms=86400000

# ─── Open-Meteo weather API ───────────────────────────────────────────────────
# Default outdoor-field coordinates used when no location is stored on a Field.
# Latitude / longitude can be extended to per-field values in a future iteration.
weather.api.base-url=https://api.open-meteo.com
# Temperature threshold in °C — bookings on outdoor fields are rejected below this.
weather.temperature.min=10.0

# ─── Springdoc / Swagger ──────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.sportsbooking=INFO
logging.level.org.springframework.security=WARN
