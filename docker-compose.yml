version: "3.9"

services:

  mysql:
    image: mysql:8.3
    container_name: sportsbooking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: sportsbooking
      MYSQL_USER: sportsuser
      MYSQL_PASSWORD: sportspass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sportsuser", "-psportspass"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
